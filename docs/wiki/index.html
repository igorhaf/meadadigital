<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Meada — Wiki</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Wiki de regras de negócio do Meada — SaaS multi-tenant de atendimento via WhatsApp com IA">
  <link rel="stylesheet" href="assets/theme-vue.css">
  <style>
    :root { --theme-color: #0d9488; }
    .sidebar { font-size: 14px; }
    .markdown-section { max-width: 62em; }
    .markdown-section table { display: table; width: 100%; overflow-x: auto; }
    @media (max-width: 900px) { .markdown-section table { display: block; } }
  </style>
</head>
<body>
  <div id="app">Carregando a wiki…</div>
  <script>
    window.$docsify = {
      name: 'Meada — Wiki',
      homepage: '00-HOME.md',
      loadSidebar: true,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      subMaxLevel: 0,
      auto2top: true,
      relativePath: true,
      search: { placeholder: 'Buscar na wiki…', noData: 'Nada encontrado', depth: 3 }
    }
  </script>
  <script src="assets/docsify.min.js"></script>
  <script src="assets/search.min.js"></script>
</body>
</html>
